<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ativar acesso · Nutrion</title><link rel="stylesheet" href="/auth.css"/></head><body><main class="auth-shell"><a class="auth-brand" href="/"><img src="/outputs/nutrion-brasao-transparente.png" alt=""/><span>NUTRION</span></a><section class="auth-card"><div class="eyebrow">PORTAL DO PACIENTE</div><h1>Ative seu acesso</h1><p class="auth-intro">Crie uma senha para consultar os planos que sua nutricionista publicar.</p><form id="activateForm"><label>Crie uma senha<input required type="password" name="password" minlength="8" maxlength="256" autocomplete="new-password" placeholder="Mín. 8 caracteres, maiúscula, número e símbolo"/></label><p class="password-hint">Use pelo menos 8 caracteres, com uma letra maiúscula, um número e um símbolo.</p><label>Repita a senha<input required type="password" name="confirm" minlength="8" maxlength="256" autocomplete="new-password" placeholder="Digite novamente"/></label><p class="auth-error hidden" id="activateError" role="alert"></p><button class="auth-submit" type="submit">Ativar acesso</button></form><div id="activationSuccess" class="hidden"></div><p class="auth-note">O convite expira em 48 horas. Se expirou, solicite um novo à sua nutricionista.</p></section></main><script src="/auth.js"></script></body></html>
